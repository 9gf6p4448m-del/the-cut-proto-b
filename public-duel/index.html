<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="刀譜對決">
<meta name="theme-color" content="#07090D">
<meta name="build-sha" content="__BUILD_SHA__">
<title>執刀者 刀譜對決 研究片段</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="stylesheet" href="./style.css?v=__BUILD_SHA__">
</head>
<body class="duel">
<header id="top">
  <div class="warn"><b class="tag">研究片段</b> 刀譜對決 <b id="ver">v0.1</b> duel · 版本 <span id="sha"></span> · 試玩數值</div>
  <div class="hpRow">
    <div class="hp foe"><span id="foeName">敵 1/3</span><div class="bar"><i id="hpFoeBar"></i></div><b id="hpFoe">300</b></div>
    <div class="clock"><b id="clock">60</b></div>
  </div>
  <div class="hpRow">
    <div class="hp me"><span>你</span><div class="bar"><i id="hpMeBar"></i></div><b id="hpMe">300</b></div>
    <div class="cd"><i id="cdBar"></i></div>
  </div>
  <div id="preview" class="preview" aria-live="polite"></div>
</header>
<main><canvas id="scene"></canvas></main>
<footer>
  <div class="tools">
    <button id="sound" aria-pressed="true">音效：開</button>
    <button id="restart">重新征途</button>
  </div>
</footer>
<section id="stitchModal" class="modal" hidden>
  <div class="box">
    <h2 id="stitchTitle">勝！挑一個縫上</h2>
    <div id="stitchOpts" class="opts"></div>
    <p id="slotHint" class="hint" hidden>槽滿了：選要替換哪一槽</p>
    <div id="slotOpts" class="slots" hidden></div>
  </div>
</section>
<section id="endModal" class="modal" hidden>
  <div class="box end">
    <h2 id="endTitle"></h2>
    <div id="endBody"></div>
    <button id="again" class="primary">再來一次征途</button>
  </div>
</section>
<script src="./app.js?v=__BUILD_SHA__"></script>
</body>
</html>
