<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="對決5">
<meta name="theme-color" content="#070D19">
<meta name="build-sha" content="b9273ea">
<title>執刀者 對決 v0.5 千節蛇 研究片段</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="stylesheet" href="./style.css?v=b9273ea">
</head>
<body class="cb">
<header id="top">
  <div class="warn"><b class="tag">研究片段</b> 對決 <b id="ver">v0.5 千節蛇</b> · 版本 <span id="sha"></span></div>
  <div class="row1"><b id="stage">對手 1／3</b><span id="phase" class="ph">切割</span><b id="clock" class="clock">30</b></div>
  <div class="bars">
    <div class="bar foe"><span>敵</span><div class="track"><i id="foeBar"></i><u id="foeShield"></u></div><b id="foeTxt"></b></div>
    <div class="bar me"><span>你</span><div class="track"><i id="meBar"></i><u id="meShield"></u></div><b id="meTxt"></b></div>
  </div>
  <div class="row2"><div class="cdwrap" title="出刀冷卻"><i id="cd"></i></div><div id="info" class="info" aria-live="polite"></div></div>
</header>
<main><canvas id="scene"></canvas><div id="tip" class="tip" role="status" hidden></div><div id="tut" class="tut" hidden><p id="tutText"></p><button id="tutSkip">跳過教學</button></div><button id="nextFoe" class="nextFoe primary" hidden>下一位對手</button><button id="skill" class="skillBtn" hidden>技能</button><div id="matchup" class="matchup" hidden></div><div id="loading" class="loading">載入幽光素材中…</div><div id="loadErr" class="loadErr" hidden><p id="loadMsg"></p><button id="retry" class="primary">重試載入</button><pre id="loadLog"></pre></div></main>
<footer>
  <div class="tools">
    <button id="inputMode">操作：即時劃刀</button>
    <button id="fast">快轉</button>
    <button id="sound" aria-pressed="true">音效：開</button>
    <button id="restart">重新征途</button>
  </div>
</footer>
<section id="beast" class="modal" hidden>
  <div class="box"><h2>選你的怪獸</h2><p class="hint">每次新征途都可以換。</p><div class="beastCards">
    <button id="beastDragon" class="beastCard"><canvas id="thumbDragon" width="160" height="120"></canvas><b>幽光龍</b><small class="org">器官：爪、心、眼、毒、骨（9 顆，分散在龍身）</small><small class="sk">技能「蛻生」：立刻長回 1 個被切的器官（每場一次）</small><small class="sty">平衡，器官分散好防守</small></button>
    <button id="beastSnake" class="beastCard"><canvas id="thumbSnake" width="160" height="120"></canvas><b>千節蛇</b><small class="org">器官：毒 3、爪 2、蛇牙 1、心 1、眼 1、骨 1（排成一列）</small><small class="sk">技能「穿刺」：5 秒內的下一刀最多連切 3 個（每場一次）</small><small class="sty">器官排成一列、貼近前線，靠技能一刀連切</small></button>
  </div></div>
</section>
<section id="contrib" class="modal" hidden>
  <div class="box"><h2 id="contribTitle"></h2><div id="contribBody"></div><button id="contribNext" class="primary">繼續</button></div>
</section>
<section id="pick" class="modal" hidden>
  <div class="box"><h2>挑一個器官縫進身體</h2><p class="hint">選好後，點你的獸身放下去。</p><div id="pickOpts" class="opts"></div></div>
</section>
<section id="end" class="modal" hidden>
  <div class="box end"><h2 id="endTitle"></h2><div id="endBody"></div><button id="again" class="primary">再來一次征途</button></div>
</section>
<script src="./app.js?v=b9273ea"></script>
</body>
</html>
