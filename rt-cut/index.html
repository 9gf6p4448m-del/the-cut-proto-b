<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="即時亂切">
<meta name="theme-color" content="#0E1116">
<meta name="build-sha" content="83384dd">
<title>執刀者 即時亂切 研究片段</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="stylesheet" href="./style.css?v=83384dd">
</head>
<body class="rt">
<header id="top">
  <div class="warn"><b class="tag">研究片段</b> 即時亂切 rt-cut · 版本 <span id="sha"></span> · 非正式規則</div>
  <div class="hudrow">
    <div id="timer" class="timer">40.0</div>
    <div class="cds">
      <div class="cd me"><span>你的刀</span><div class="bar"><i id="cdMe"></i></div><b id="cdMeTxt">好了</b></div>
      <div class="cd foe"><span>牠的刀</span><div class="bar"><i id="cdFoe"></i></div><b id="cdFoeTxt">好了</b></div>
    </div>
  </div>
  <div class="counts"><span class="me" id="cntMe"></span><span class="foe" id="cntFoe"></span></div>
  <div id="info" class="info" role="status" aria-live="polite"></div>
</header>
<main><canvas id="scene"></canvas></main>
<footer>
  <div class="tools">
    <button id="restart" class="primary">重開</button>
    <button id="reduce" aria-pressed="false">減少閃爍震動</button>
  </div>
</footer>
<section id="result" class="result" hidden>
  <div class="box">
    <h2 id="resTitle"></h2>
    <table id="resTable"></table>
    <button id="resRestart" class="primary">再來一局</button>
  </div>
</section>
<script src="./app.js?v=83384dd"></script>
</body>
</html>
