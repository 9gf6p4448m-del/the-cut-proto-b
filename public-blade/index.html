<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="刀譜">
<meta name="theme-color" content="#07090D">
<meta name="build-sha" content="__BUILD_SHA__">
<title>執刀者 刀譜 研究片段</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="stylesheet" href="./style.css?v=__BUILD_SHA__">
</head>
<body class="blade">
<header id="top">
  <div class="warn"><b class="tag">研究片段</b> 刀譜 <b id="ver">v0.3</b> blade · 版本 <span id="sha"></span> · 試玩數值</div>
  <div class="hud">
    <div class="stat"><span>怪物</span><b id="mon">1/3</b></div>
    <div class="stat goal"><span>分數 / 門檻</span><b id="goal">0/100</b><div class="bar"><i id="goalBar"></i></div></div>
    <div class="stat"><span>刀</span><b id="cuts">4</b></div>
    <div class="stat"><span>總分</span><b id="total">0</b></div>
  </div>
  <div id="preview" class="preview" aria-live="polite"></div>
</header>
<main><canvas id="scene"></canvas></main>
<footer>
  <div class="tools">
    <button id="twitch">抽搐（剩 2）</button>
    <button id="sound" aria-pressed="true">音效：開</button>
    <button id="restart">再來一局</button>
  </div>
</footer>
<section id="stitchModal" class="modal" hidden>
  <div class="box">
    <h2 id="stitchTitle">擊倒！挑一個縫上</h2>
    <div id="stitchOpts" class="opts"></div>
    <p id="slotHint" class="hint" hidden>槽滿了：選要替換哪一槽</p>
    <div id="slotOpts" class="slots" hidden></div>
  </div>
</section>
<section id="endModal" class="modal" hidden>
  <div class="box end">
    <h2 id="endTitle"></h2>
    <div id="endBody"></div>
    <button id="again" class="primary">再來一局</button>
  </div>
</section>
<script src="./app.js?v=__BUILD_SHA__"></script>
</body>
</html>
